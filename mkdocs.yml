# ============================================================
# YYH 维基 - MkDocs 配置文件（最小可用版）
# ============================================================

site_name: YYH 维基
site_description: YYH 的个人知识库
site_author: YYH
site_url: https://yyh2024.github.io/yyh-wiki/

repo_name: yyh2024/yyh-wiki
repo_url: https://github.com/yyh2024/yyh-wiki
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 YYH

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom      # ← 改成 custom
      accent: custom
  extra_css:
    - stylesheets/extra.css
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
